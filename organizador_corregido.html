<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Organizador - Torneo Inter Tio Cucho</title>
<style>
body{margin:0;background:#070707;color:#f7f3ea;font-family:Arial,sans-serif}
main{max-width:760px;margin:auto;padding:18px}
.card{background:#121212;border:1px solid #4d4028;border-radius:18px;padding:18px;margin:15px 0}
h1,h2,h3{color:#e0b85f}
input,select,button{width:100%;box-sizing:border-box;padding:13px;margin:6px 0;border-radius:10px;font-size:16px}
input,select{background:#080808;color:white;border:1px solid #55472c}
button{background:#e0b85f;color:#100d06;border:0;font-weight:bold}
button.secondary{background:#29251d;color:#f7f3ea;border:1px solid #55472c}
button.danger{background:#8f2f2f;color:white}
button:disabled{opacity:.55}
.item{border-top:1px solid #403520;padding:18px 0}
.info{color:#bbb;line-height:1.7}
.error{color:#ff9f9f}.ok{color:#9cc9a6}
.edit{display:none;margin-top:14px;padding-top:14px;border-top:1px solid #403520}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media(max-width:520px){.grid{grid-template-columns:1fr}}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#29251d;color:#e0b85f;font-size:13px}
.small{font-size:13px;color:#999}
</style>
</head>
<body>
<main>
<h1>🏆 Panel del Organizador</h1>
<p>TORNEO INTER TIO CUCHO · 18 PUESTOS</p>

<div id="loginBox" class="card">
<h2>Acceso del organizador</h2>
<input id="email" type="email" placeholder="Correo electrónico">
<input id="password" type="password" placeholder="Contraseña">
<button id="login">INGRESAR</button>
<p id="loginError" class="error"></p>
</div>

<div id="panel" style="display:none">
<div class="card">
<h2>Resumen</h2>
<p>Puestos ocupados: <b id="ocupados">0</b></p>
<p>Puestos disponibles: <b id="disponibles">18</b></p>
<p>Recaudación: <b id="recaudacion">0 Gs.</b></p>
<button id="salir">CERRAR SESIÓN</button>
</div>

<div class="card">
<h2>Participantes</h2>
<p class="small">Puedes editar nombre, puntos, estado y pago. Los cambios se guardan directamente en Firebase.</p>
<div id="mensaje"></div>
<div id="lista">Cargando...</div>
</div>
</div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script>
const firebaseConfig={
apiKey:"AIzaSyBDaj8e38W8AOyR6yfNQ7AQoW5bf5i2J9Q",
authDomain:"torneo-tio-cucho.firebaseapp.com",
databaseURL:"https://torneo-tio-cucho-default-rtdb.firebaseio.com",
projectId:"torneo-tio-cucho",
storageBucket:"torneo-tio-cucho.firebasestorage.app",
messagingSenderId:"468748796216",
appId:"1:468748796216:web:2aef532476f612e96801cd"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.database();
const players=db.ref("players");

const loginBox=document.getElementById("loginBox");
const panel=document.getElementById("panel");

document.getElementById("login").onclick=async()=>{
 const email=document.getElementById("email").value.trim();
 const password=document.getElementById("password").value;
 try{
   await auth.signInWithEmailAndPassword(email,password);
   document.getElementById("loginError").textContent="";
 }catch(e){
   document.getElementById("loginError").textContent="No se pudo ingresar: "+e.message;
 }
};

document.getElementById("salir").onclick=()=>auth.signOut();

auth.onAuthStateChanged(user=>{
 if(user){
   loginBox.style.display="none";
   panel.style.display="block";
   cargarDatos();
 }else{
   loginBox.style.display="block";
   panel.style.display="none";
 }
});

function esc(v){
 return String(v??"")
 .replace(/&/g,"&amp;")
 .replace(/</g,"&lt;")
 .replace(/>/g,"&gt;")
 .replace(/"/g,"&quot;");
}

function mostrarMensaje(texto,ok=true){
 const m=document.getElementById("mensaje");
 m.className=ok?"ok":"error";
 m.textContent=texto;
}

function cargarDatos(){
 players.off("value");
 players.on("value",snapshot=>{
   const data=snapshot.val()||{};
   const puestos=Object.keys(data).sort((a,b)=>Number(a)-Number(b));

   document.getElementById("ocupados").textContent=puestos.length;
   document.getElementById("disponibles").textContent=Math.max(0,18-puestos.length);
   document.getElementById("recaudacion").textContent=(puestos.length*100000).toLocaleString("es-PY")+" Gs.";

   const lista=document.getElementById("lista");

   if(!puestos.length){
     lista.innerHTML="<p>No hay puestos apartados.</p>";
     return;
   }

   lista.innerHTML="";

   puestos.forEach(puesto=>{
     const p=data[puesto]||{};
     const names=Array.isArray(p.names)?p.names:[];
     const points=Array.isArray(p.points)?p.points:[];

     const div=document.createElement("div");
     div.className="item";

     div.innerHTML=
       "<h3>Puesto "+String(puesto).padStart(2,"0")+" <span class='badge'>"+esc(p.status||"apartado")+"</span></h3>"+
       "<div class='info'><b>Participante:</b> "+esc(names.join(" + ")||"Sin nombre")+"<br>"+
       "<b>Puntos:</b> "+esc(points.join(" + ")||"0")+"<br>"+
       "<b>Pago:</b> "+(p.paid===true?"PAGADO":"PENDIENTE")+"</div>"+
       "<button class='secondary' onclick='toggleEdit("+JSON.stringify(puesto)+")'>✏️ EDITAR</button>"+
       "<div class='edit' id='edit-"+esc(puesto)+"'>"+
       "<div class='grid'>"+
       "<div><label>Nombre 1</label><input id='n1-"+esc(puesto)+"' value='"+esc(names[0]||"")+"'></div>"+
       "<div><label>Nombre 2 (opcional)</label><input id='n2-"+esc(puesto)+"' value='"+esc(names[1]||"")+"'></div>"+
       "</div>"+
       "<div class='grid'>"+
       "<div><label>Puntos 1</label><input id='p1-"+esc(puesto)+"' type='number' min='0' value='"+esc(points[0]??2)+"'></div>"+
       "<div><label>Puntos 2 (si corresponde)</label><input id='p2-"+esc(puesto)+"' type='number' min='0' value='"+esc(points[1]??1)+"'></div>"+
       "</div>"+
       "<label>Estado</label>"+
       "<select id='s-"+esc(puesto)+"'>"+
       "<option value='held'>held</option>"+
       "<option value='apartado'>apartado</option>"+
       "<option value='confirmado'>confirmado</option>"+
       "<option value='finalizado'>finalizado</option>"+
       "</select>"+
       "<label>Pago</label>"+
       "<select id='paid-"+esc(puesto)+"'>"+
       "<option value='false'>PENDIENTE</option>"+
       "<option value='true'>PAGADO</option>"+
       "</select>"+
       "<button id='save-"+esc(puesto)+"' onclick='guardar("+JSON.stringify(puesto)+")'>💾 GUARDAR CAMBIOS</button>"+
       "<button class='danger' onclick='eliminar("+JSON.stringify(puesto)+")'>🗑️ ELIMINAR PUESTO</button>"+
       "</div>";

     lista.appendChild(div);

     document.getElementById("s-"+puesto).value=p.status||"apartado";
     document.getElementById("paid-"+puesto).value=p.paid===true?"true":"false";
   });
 });
}

function toggleEdit(puesto){
 const e=document.getElementById("edit-"+puesto);
 e.style.display=e.style.display==="block"?"none":"block";
}

async function guardar(puesto){
 const save=document.getElementById("save-"+puesto);

 try{
   save.disabled=true;
   save.textContent="⏳ GUARDANDO...";
   mostrarMensaje("Guardando cambios del puesto "+puesto+"...");

   const n1=document.getElementById("n1-"+puesto).value.trim();
   const n2=document.getElementById("n2-"+puesto).value.trim();

   if(!n1){
     throw new Error("El nombre de la primera persona no puede quedar vacío.");
   }

   const names=[n1,n2].filter(Boolean);

   const p1=Number(document.getElementById("p1-"+puesto).value||0);
   const p2=Number(document.getElementById("p2-"+puesto).value||0);
   const points=n2?[p1,p2]:[p1];

   const status=document.getElementById("s-"+puesto).value;
   const paid=document.getElementById("paid-"+puesto).value==="true";

   const cambios={
     names:names,
     points:points,
     status:status,
     paid:paid
   };

   await players.child(String(puesto)).update(cambios);

   const comprobacion=await players.child(String(puesto)).once("value");
   const guardado=comprobacion.val()||{};

   if(guardado.paid!==paid){
     throw new Error("Firebase no confirmó el cambio de pago. Revisa las reglas de la base de datos.");
   }

   if(paid){
     mostrarMensaje("✅ Puesto "+puesto+" guardado correctamente como PAGADO.",true);
   }else{
     mostrarMensaje("✅ Puesto "+puesto+" actualizado correctamente.",true);
   }

 }catch(e){
   console.error(e);
   mostrarMensaje("❌ No se pudo guardar: "+(e.message||e),false);
 }finally{
   save.disabled=false;
   save.textContent="💾 GUARDAR CAMBIOS";
 }
}

async function eliminar(puesto){
 if(!confirm("¿Seguro que quieres eliminar el puesto "+puesto+"?"))return;

 try{
   mostrarMensaje("Eliminando puesto "+puesto+"...");
   await players.child(String(puesto)).remove();

   const comprobacion=await players.child(String(puesto)).once("value");
   if(comprobacion.exists()){
     throw new Error("Firebase no confirmó la eliminación.");
   }

   mostrarMensaje("✅ Puesto "+puesto+" eliminado.",true);
 }catch(e){
   mostrarMensaje("❌ No se pudo eliminar: "+(e.message||e),false);
 }
}
</script>
</body>
</html>
